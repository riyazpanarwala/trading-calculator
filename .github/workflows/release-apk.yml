name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. v1.0.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK via EAS
        run: |
          eas build --platform android --profile apk --non-interactive --wait --json > build.json

      - name: Download Built APK
        run: |
          APK_URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('build.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build.artifacts?.buildUrl;
            if (!url) {
              console.error('Build output did not contain artifacts.buildUrl:');
              console.error(JSON.stringify(data, null, 2));
              process.exit(1);
            }
            process.stdout.write(url);
          ")
          echo "Downloading APK from: $APK_URL"
          curl -L -o Universal-Trading-Calculator.apk "$APK_URL"
          ls -lh Universal-Trading-Calculator.apk


      - name: Determine Tag and Release Name
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${PKG_VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Universal Trading Calculator ${{ steps.release_info.outputs.tag_name }}
          files: ./Universal-Trading-Calculator.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
